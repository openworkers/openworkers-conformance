[package]
name = "openworkers-conformance"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
v8 = ["dep:openworkers-runtime-v8"]

[dependencies]
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.13.0" }
openworkers-runtime-v8 = { git = "https://github.com/openworkers/openworkers-runtime-v8", tag = "v0.13.3", optional = true, features = ["ptrcomp"] }

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
bytes = "1"
