[package]
name = "openworkers-conformance"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
v8 = ["dep:openworkers-runtime-v8", "dep:openworkers-transform", "dep:sha2"]

[dependencies]
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.14.0" }
# Sibling checkout, like openworkers-runtime-v8 itself expects for core: the
# oracle has to be produced by the runtime as it stands, not by a published tag.
openworkers-runtime-v8 = { path = "../openworkers-runtime-v8", optional = true, features = ["ptrcomp"] }
# ESM -> classic script lowering, the same pass every runtime uses.
openworkers-transform = { git = "https://github.com/openworkers/openworkers-transform", tag = "v0.1.0", optional = true }

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
