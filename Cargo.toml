[package]
name = "openworkers-conformance"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
v8 = ["dep:openworkers-runtime-v8"]

[dependencies]
openworkers-core = { git = "https://github.com/openworkers/openworkers-core", tag = "v0.13.1" }
openworkers-runtime-v8 = { path = "../openworkers-runtime-v8", optional = true, features = ["ptrcomp"] }

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
